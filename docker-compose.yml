services:
  pipeline:
    build: .
    image: cabcast:latest
    command: ["python", "-m", "cabcast.cli", "all", "--source", "auto"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    environment:
      CABCAST_PROJECT__RANDOM_SEED: "20260823"

  api:
    build: .
    image: cabcast:latest
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
