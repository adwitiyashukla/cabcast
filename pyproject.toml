[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow"
version = "0.1.0"
description = "NYC taxi demand forecasting with calibrated uncertainty and optimal-transport fleet rebalancing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
keywords = ["mlops", "forecasting", "conformal-prediction", "optimal-transport", "geospatial", "causal-inference"]

dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "h3>=4.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "networkx>=3.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "POT>=0.9"]

[project.scripts]
urbanflow = "urbanflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests", "integration: requires built artifacts"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "except ImportError",
    "raise ImportError",
    "def __repr__",
]
